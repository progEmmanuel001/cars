<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop Cards Grid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
    <header>
    <h1>Emirex</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="nissan.html">Nissan</a>
      <a href="bmw.html">Bmw</a>
      <a href="audi.html">Audi</a>
      <a href="shop.html"><b style="color: red;">SHOP</b></a>
    </nav>
    <a href="form.html"><button class="button">Sign In</button></a>
  </header>
  <div class="container">
    <h2 style="margin-bottom:18px"><b style="color: cyan;">MPR</b> Auto<i style="color: red;">Shop</i></h2>
    <div class="grid">

      <!-- Card 1 -->
      <article class="card">
        <div class="image-wrap">
          <img src="mercedes.png" alt="car 1">
          <div class="ribbon">Available</div>
        </div>
          <div class="info">
            <div class="title">Mercedes G 350d ($179,000)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <div class="image-wrap">
          <img src="nissan.png" alt="car 2">
          <div class="ribbon">Available</div>
        </div>
          <div class="info">
            <div class="title">Nissan Skyline R34 GT-R ($250,000)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

      <!-- Card 3 -->
      <article class="card">
        <div class="image-wrap">
          <img src="audi1.png" alt="car 3">
          <div class="ribbon">Available</div>
        </div>
          <div class="info">
            <div class="title">Audi R8 ($249,900)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

      <!-- Card 4 -->
      <article class="card">
        <div class="image-wrap">
          <img src="benz.png" alt="car 4">
          <div class="ribbon">Sold Out</div>
        </div>
          <div class="info">
            <div class="title">AMG C63 ($80,000)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

      <!-- Card 5 -->
      <article class="card">
        <div class="image-wrap">
          <img src="bmw1.png" alt="car 5">
          <div class="ribbon">Available</div>
        </div>
          <div class="info">
            <div class="title">Bmw M2 ($50,900)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

      <!-- Card 6 -->
      <article class="card">
        <div class="image-wrap">
          <img src="r35.png" alt="car 6">
          <div class="ribbon">Available</div>
        </div>
          <div class="info">
            <div class="title">GT-R R35 ($330,000)</div>
            <button class="learn-btn">Purchase</button>
          </div>
      </article>

    </div>
  </div>
</body>
</html>
